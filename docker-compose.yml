services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview_copilot_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_copilot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
